name: Laura Agent

on:
  workflow_dispatch:

jobs:
  laura:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Laura
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenAI
        run: pip install openai

      - name: Run Laura
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python laura.py
